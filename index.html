<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>楚河漢界 · 3D 中国象棋</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
  <script>
    window.__chessBooted = false;
    window.__showBootError = (message) => {
      const screen = document.getElementById('bootScreen');
      const text = document.getElementById('bootText');
      if (!screen || !text) return;
      screen.classList.add('error');
      text.textContent = message || '战场初始化失败，请刷新页面重试';
    };
    window.__markChessReady = () => {
      window.__chessBooted = true;
      document.getElementById('bootScreen')?.classList.add('hidden');
    };
    window.addEventListener('error', (event) => {
      if (!window.__chessBooted) window.__showBootError(`战场初始化失败：${event.message || '资源加载异常'}`);
    });
    window.addEventListener('unhandledrejection', (event) => {
      if (!window.__chessBooted) window.__showBootError(`战场初始化失败：${event.reason?.message || '模块加载异常'}`);
    });
    window.setTimeout(() => {
      if (!window.__chessBooted) window.__showBootError('战场加载超时，请确认浏览器支持 WebGL 后刷新');
    }, 12000);
  </script>
</head>
<body>
  <div id="bootScreen" role="status" aria-live="polite">
    <div class="boot-emblem"><span>楚</span><i></i><span>漢</span></div>
    <p id="bootText">正在点将 · 布置战场</p>
    <div class="boot-line"><b></b></div>
  </div>
  <canvas id="scene"></canvas>

  <header class="hud-top">
    <div class="seal">将</div>
    <div class="brand">
      <h1>楚河漢界</h1>
      <p>3D 中国象棋 · 拟人战阵</p>
    </div>
    <div id="turnBadge" class="turn red">红方行棋</div>
    <nav class="actions">
      <button id="btnUndo" title="悔棋">悔棋</button>
      <button id="btnCam" title="换边视角">换边</button>
      <button id="btnRestart" title="重新开始">重开</button>
      <a class="repo-link" href="https://github.com/tsonglew/chess-cn" target="_blank" rel="noopener" title="项目地址">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        <span>GitHub</span>
      </a>
    </nav>
  </header>

  <aside id="panel">
    <div class="cap-block">
      <h3>红方战利</h3>
      <div id="capRed" class="chips"><span class="none">—</span></div>
    </div>
    <div class="divider"></div>
    <div class="cap-block">
      <h3>黑方战利</h3>
      <div id="capBlack" class="chips"><span class="none">—</span></div>
    </div>
  </aside>

  <div id="checkBanner">將軍！</div>
  <div id="hint">点击己方棋子查看可走位置 · 拖拽旋转视角</div>

  <div id="overlay">
    <div class="overlay-card">
      <h1 id="resultText">紅方大勝</h1>
      <p id="resultSub">绝杀无解</p>
      <button id="btnAgain">再 来 一 局</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
  <noscript><p class="noscript">请启用 JavaScript 后进入战场。</p></noscript>
</body>
</html>
